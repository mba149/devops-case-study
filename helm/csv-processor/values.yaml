replicaCount: 1

image:
  repository: csv-processor
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nginx:
  image:
    repository: nginxinc/nginx-unprivileged
    tag: "1.28.1-alpine"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

aws:
  region: us-east-2
  bucket: bilal-spidersilk
  prefix: processed/
  credentialsSecretName: ""

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  app:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  nginx:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

nodeSelector: {}
tolerations: []
affinity: {}
