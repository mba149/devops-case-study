apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csv-processor.fullname" . }}
  labels:
    {{- include "csv-processor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "csv-processor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/app-config: {{ include (print $.Template.BasePath "/configmap-app.yaml") . | sha256sum }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "csv-processor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: copy-public-assets
          image: {{ include "csv-processor.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - cp -R /app/src/csv_processor/static/. /shared-assets/
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: public-assets
              mountPath: /shared-assets
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          command:
            - nginx
            - -g
            - daemon off;
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: public-assets
              mountPath: /usr/share/nginx/html/static
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
        - name: app
          image: {{ include "csv-processor.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: app-http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "csv-processor.fullname" . }}-app
            {{- with .Values.aws.credentialsSecretName }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: app-http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: app-http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: public-assets
              mountPath: /app/public
              readOnly: true
            - name: app-tmp
              mountPath: /tmp
      volumes:
        - name: public-assets
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ include "csv-processor.fullname" . }}-nginx
        - name: app-tmp
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
